name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Code Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and Compile Check
        run: |
          python3 -m py_compile server.py render_loop.py dashboard_k4.py nuvola_client.py db.py manage_tasks.py login_nuvola.py
          python3 -m unittest discover tests
          echo "Syntax check e unit test completati con successo."
