version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kindle_postgres
    restart: always
    environment:
      POSTGRES_DB: kindle_calendar
      POSTGRES_USER: kindle
      POSTGRES_PASSWORD: kindle_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindle -d kindle_calendar"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: kindle_server
    restart: always
    ports:
      - "5055:5055"
    environment:
      - PORT=5055
      - DATABASE_URL=postgresql://kindle:kindle_password@postgres:5432/kindle_calendar
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
